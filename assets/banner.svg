<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="WinForms Learning Path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/><stop offset="0.55" stop-color="#0b2a4d"/><stop offset="1" stop-color="#0078d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#4cc2ff" stop-opacity="0.40"/><stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="bar"><rect x="714" y="188" width="392" height="14" rx="7"/></clipPath>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
    <g filter="url(#shadow)">
      <rect x="690" y="38" width="440" height="222" rx="8" fill="#f3f3f3"/>
    </g>
    <path d="M690 46 a8 8 0 0 1 8 -8 H1122 a8 8 0 0 1 8 8 V72 H690 Z" fill="#ffffff"/>
    <text x="704" y="60" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#1f1f1f">Form1</text>
    <text x="1038" y="61" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#1f1f1f">—</text>
    <rect x="1070" y="50" width="10" height="10" fill="none" stroke="#1f1f1f" stroke-width="1.3"/>
    <text x="1102" y="61" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#1f1f1f">✕</text>
    <line x1="690" y1="72" x2="1130" y2="72" stroke="#d9d9d9"/>

    <text x="714" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1f1f1f">Name:</text>
    <rect x="768" y="88" width="190" height="26" fill="#ffffff" stroke="#8a8a8a"/>
    <text x="776" y="106" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1f1f1f">
      <tspan>Hello, WinForms</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.3;0.9;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <rect x="714" y="130" width="15" height="15" fill="#ffffff" stroke="#6b6b6b"/>
    <path d="M717 138 l3 3 l6 -7" fill="none" stroke="#0078d4" stroke-width="2.2" stroke-dasharray="14" stroke-dashoffset="14">
      <animate attributeName="stroke-dashoffset" values="14;14;0;0;14" keyTimes="0;0.2;0.3;0.9;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <text x="736" y="143" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1f1f1f">Remember me</text>

    <circle cx="886" cy="138" r="8" fill="#ffffff" stroke="#6b6b6b"/>
    <circle cx="886" cy="138" r="4" fill="#0078d4">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.42;0.9;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="902" y="143" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1f1f1f">Option</text>

    <rect x="990" y="126" width="116" height="30" rx="4" fill="#0078d4">
      <animate attributeName="fill" values="#0078d4;#0078d4;#005a9e;#0078d4;#0078d4" keyTimes="0;0.5;0.56;0.64;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="1048" y="146" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#ffffff">Start</text>

    <rect x="714" y="188" width="392" height="14" rx="7" fill="#e1e1e1"/>
    <g clip-path="url(#bar)">
      <rect x="714" y="188" width="392" height="14" fill="#0078d4">
        <animate attributeName="width" values="0;0;392;392;0" keyTimes="0;0.56;0.9;0.97;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="714" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#6b6b6b">button1_Click(object sender, EventArgs e)</text>

    <g>
      <path d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L13 12 Z" fill="#111" stroke="#fff" stroke-width="1"/>
      <animateTransform attributeName="transform" type="translate"
        values="1110 228; 1020 146; 1020 146; 916 138; 750 134; 750 134; 1110 228"
        keyTimes="0;0.2;0.3;0.38;0.48;0.5;1" dur="8s" repeatCount="indefinite"/>
    </g>
  </g>

  <path d="M0,290.0 L20,291.9 L40,293.7 L60,295.3 L80,296.7 L100,297.8 L120,298.6 L140,299.0 L160,299.0 L180,298.6 L200,297.8 L220,296.7 L240,295.3 L260,293.7 L280,291.9 L300,290.0 L320,288.1 L340,286.3 L360,284.7 L380,283.3 L400,282.2 L420,281.4 L440,281.0 L460,281.0 L480,281.4 L500,282.2 L520,283.3 L540,284.7 L560,286.3 L580,288.1 L600,290.0 L620,291.9 L640,293.7 L660,295.3 L680,296.7 L700,297.8 L720,298.6 L740,299.0 L760,299.0 L780,298.6 L800,297.8 L820,296.7 L840,295.3 L860,293.7 L880,291.9 L900,290.0 L920,288.1 L940,286.3 L960,284.7 L980,283.3 L1000,282.2 L1020,281.4 L1040,281.0 L1060,281.0 L1080,281.4 L1100,282.2 L1120,283.3 L1140,284.7 L1160,286.3 L1180,288.1 L1200,290.0 L1220,291.9 L1240,293.7 L1260,295.3 L1280,296.7 L1300,297.8 L1320,298.6 L1340,299.0 L1360,299.0 L1380,298.6 L1400,297.8 L1420,296.7 L1440,295.3 L1460,293.7 L1480,291.9 L1500,290.0 L1520,288.1 L1540,286.3 L1560,284.7 L1580,283.3 L1600,282.2 L1620,281.4 L1640,281.0 L1660,281.0 L1680,281.4 L1700,282.2 L1720,283.3 L1740,284.7 L1760,286.3 L1780,288.1 L1800,290.0 L1820,291.9 L1800,320 L0,320 Z" fill="#1f9cf0" opacity="0.22"><animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="14s" repeatCount="indefinite"/></path>
  <path d="M0,310.4 L20,309.6 L40,308.6 L60,307.4 L80,306.1 L100,304.7 L120,303.2 L140,301.8 L160,300.4 L180,299.3 L200,298.3 L220,297.6 L240,297.1 L260,297.0 L280,297.2 L300,297.6 L320,298.4 L340,299.4 L360,300.6 L380,301.9 L400,303.3 L420,304.8 L440,306.2 L460,307.6 L480,308.7 L500,309.7 L520,310.4 L540,310.9 L560,311.0 L580,310.8 L600,310.4 L620,309.6 L640,308.6 L660,307.4 L680,306.1 L700,304.7 L720,303.2 L740,301.8 L760,300.4 L780,299.3 L800,298.3 L820,297.6 L840,297.1 L860,297.0 L880,297.2 L900,297.6 L920,298.4 L940,299.4 L960,300.6 L980,301.9 L1000,303.3 L1020,304.8 L1040,306.2 L1060,307.6 L1080,308.7 L1100,309.7 L1120,310.4 L1140,310.9 L1160,311.0 L1180,310.8 L1200,310.4 L1220,309.6 L1240,308.6 L1260,307.4 L1280,306.1 L1300,304.7 L1320,303.2 L1340,301.8 L1360,300.4 L1380,299.3 L1400,298.3 L1420,297.6 L1440,297.1 L1460,297.0 L1480,297.2 L1500,297.6 L1520,298.4 L1540,299.4 L1560,300.6 L1580,301.9 L1600,303.3 L1620,304.8 L1640,306.2 L1660,307.6 L1680,308.7 L1700,309.7 L1720,310.4 L1740,310.9 L1760,311.0 L1780,310.8 L1800,310.4 L1820,309.6 L1800,320 L0,320 Z" fill="#7fd0ff" opacity="0.16"><animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="19s" repeatCount="indefinite"/></path>

  <g>
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" fill="freeze"/>
    <text x="70" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">WinForms</text>
    <text x="70" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#4cc2ff" letter-spacing="-1">Learning Path</text>
  </g>
  <text x="72" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#bfe3ff" letter-spacing="1">Controls  ·  Events  ·  GDI+  ·  MDI  ·  SQL Server  ·  Desktop apps
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
